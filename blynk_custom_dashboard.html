<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Voltage Controller</title>
    <!-- Load Tailwind CSS for layout and utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 15% 50%, rgba(20, 25, 45, 1), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(15, 35, 45, 1), transparent 25%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .font-tech { font-family: 'Space Grotesk', sans-serif; }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Glowing Orb Visualization */
        .orb-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all 0.3s ease-out;
        }
        
        .orb-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease-out;
            z-index: 1;
        }

        .orb-icon {
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 30px; /* Hitbox height */
        }
        
        input[type=range]:focus {
            outline: none;
        }
        
        /* Slider Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        
        /* Slider Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px; /* Center thumb on track */
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* Mode Buttons Styling */
        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .mode-btn.active-light {
            background: rgba(251, 191, 36, 0.15); /* Amber tint */
            border-color: rgba(251, 191, 36, 0.6);
            color: #fcd34d;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }
        
        .mode-btn.active-fan {
            background: rgba(6, 182, 212, 0.15); /* Cyan tint */
            border-color: rgba(6, 182, 212, 0.6);
            color: #67e8f9;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        /* Smooth UI Updates */
        #power-text, #power-fill {
            transition: all 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div class="glass-panel w-full max-w-sm rounded-3xl p-8 relative flex flex-col mx-4 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-xs tracking-[0.3em] text-gray-400 font-semibold mb-1 uppercase">ESP32-S3 Core</h2>
            <h1 class="text-xl font-bold tracking-wide text-white">AC Voltage Controller</h1>
            <div class="flex items-center justify-center gap-2 mt-3">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                <span class="text-xs text-gray-400 font-medium">Blynk Cloud Sync Active</span>
            </div>
        </div>

        <!-- Center Visualization Element (Orb) -->
        <div class="orb-container mb-8" id="visual-orb">
            <div class="orb-bg" id="orb-glow"></div>
            
            <!-- Dynamic SVG Icons -->
            <div class="orb-icon text-gray-500 flex flex-col items-center justify-center">
                <!-- Lightbulb (Mode 0) -->
                <svg id="icon-light" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-2">
                    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"></path>
                    <path d="M9 18h6"></path>
                    <path d="M10 22h4"></path>
                </svg>
                <!-- Fan (Mode 1) hidden by default -->
                <svg id="icon-fan" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-2 hidden">
                    <path d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z"></path>
                    <path d="M12 12v.01"></path>
                </svg>

                <div class="text-3xl font-tech font-bold tracking-tighter" id="power-text">0%</div>
            </div>
        </div>

        <!-- Range Slider -->
        <div class="mb-8 w-full relative">
            <div class="flex justify-between text-xs text-gray-500 font-medium mb-3">
                <span>0%</span>
                <span class="text-gray-300">OUTPUT LEVEL</span>
                <span>100%</span>
            </div>
            <div class="relative">
                <!-- Custom colored track fill -->
                <div class="absolute top-[12px] left-0 h-[6px] rounded-l-full bg-gray-600 z-0 pointer-events-none" id="power-fill" style="width: 0%;"></div>
                <!-- Actual Slider -->
                <input type="range" min="0" max="100" value="0" id="power-slider" class="relative z-10">
            </div>
        </div>

        <!-- Mode Selector (0 = Light/Phase, 1 = Fan/Integral) -->
        <div class="flex gap-3 mt-auto">
            <button id="btn-mode-0" class="mode-btn active-light flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2" onclick="setMode(0)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <span class="text-sm font-semibold">Dimming</span>
            </button>
            <button id="btn-mode-1" class="mode-btn flex-1 py-3 px-4 rounded-xl flex flex-row items-center justify-center gap-2 text-gray-400" onclick="setMode(1)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v.01"/><path d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z"/></svg>
                <span class="text-sm font-semibold">Fan / Motor</span>
            </button>
        </div>

    </div>

    <script>
        // --- Configuration ---
        // Your specific Blynk Auth Token from previous instructions
        const BLYNK_AUTH_TOKEN = "JQ-1ZAwYhOtt7DDLykOU33KT7STRmewM";
        
        // --- State Variables ---
        let currentPower = 0; // 0-100 mapped to V0
        let currentMode = 0;  // 0 or 1 mapped to V1
        
        // --- DOM Elements ---
        const slider = document.getElementById('power-slider');
        const powerText = document.getElementById('power-text');
        const powerFill = document.getElementById('power-fill');
        const orbGlow = document.getElementById('orb-glow');
        
        const btnMode0 = document.getElementById('btn-mode-0');
        const btnMode1 = document.getElementById('btn-mode-1');
        
        const iconLight = document.getElementById('icon-light');
        const iconFan = document.getElementById('icon-fan');

        // --- Blynk API Network Function ---
        // Sends HTTP GET requests to the Blynk Cloud to update Datastreams
        function syncWithBlynk(pin, value) {
            const url = `https://blynk.cloud/external/api/update?token=${BLYNK_AUTH_TOKEN}&${pin}=${value}`;
            
            fetch(url)
                .then(response => {
                    if(!response.ok) console.warn("Failed to sync pin:", pin);
                })
                .catch(error => {
                    console.error("Network error syncing with Blynk:", error);
                });
        }

        // --- UI Update Logic ---
        function updateUI() {
            // Update Text and Fill Bar
            powerText.innerText = `${currentPower}%`;
            powerFill.style.width = `${currentPower}%`;

            // Setup Theme Colors based on Mode
            // Light Mode = Amber (rgba 251, 191, 36) | Fan Mode = Cyan (rgba 6, 182, 212)
            const colorRgb = currentMode === 0 ? '251, 191, 36' : '6, 182, 212';
            
            // Calculate dynamic glow and opacity based on slider value (0.0 to 1.0)
            const intensity = currentPower / 100;
            const glowSpread = 10 + (intensity * 60); // 10px to 70px spread
            const opacity = 0.1 + (intensity * 0.9);  // 10% to 100% opacity
            
            // Apply Glowing Orb Styles
            orbGlow.style.boxShadow = `0 0 ${glowSpread}px rgba(${colorRgb}, ${opacity})`;
            orbGlow.style.backgroundColor = `rgba(${colorRgb}, ${opacity * 0.15})`;
            orbGlow.style.borderColor = `rgba(${colorRgb}, ${opacity * 0.5})`;
            
            // Apply Color to Slider Fill Bar
            powerFill.style.backgroundColor = `rgb(${colorRgb})`;
            powerText.style.color = intensity > 0.1 ? `rgb(${colorRgb})` : '#6b7280'; // gray-500 if low

            // Handle Icons & Text Color inside Orb
            if (currentMode === 0) {
                iconLight.classList.remove('hidden');
                iconFan.classList.add('hidden');
                iconLight.style.color = intensity > 0.1 ? `rgb(${colorRgb})` : '#6b7280';
            } else {
                iconFan.classList.remove('hidden');
                iconLight.classList.add('hidden');
                
                // Add spin animation for fan if power > 0
                if (intensity > 0) {
                    const spinDuration = Math.max(0.2, 2 - (intensity * 1.8)); // Spins faster at higher power
                    iconFan.style.animation = `spin ${spinDuration}s linear infinite`;
                    iconFan.style.color = `rgb(${colorRgb})`;
                } else {
                    iconFan.style.animation = 'none';
                    iconFan.style.color = '#6b7280';
                }
            }
        }

        // --- Event Listeners ---

        // 1. Slider Input Event (Fires continuously while dragging for real-time UI)
        let debounceTimer;
        slider.addEventListener('input', (e) => {
            currentPower = parseInt(e.target.value);
            updateUI();
            
            // Debounce API calls to prevent flooding Blynk while dragging
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                syncWithBlynk('V0', currentPower);
            }, 100); 
        });

        // 2. Slider Change Event (Fires once when mouse is released to guarantee final state)
        slider.addEventListener('change', (e) => {
            currentPower = parseInt(e.target.value);
            updateUI();
            syncWithBlynk('V0', currentPower);
        });

        // 3. Mode Toggle Function
        window.setMode = function(mode) {
            currentMode = mode;
            
            if (mode === 0) {
                // Style Light Button Active
                btnMode0.classList.add('active-light');
                btnMode0.classList.remove('text-gray-400');
                // Style Fan Button Inactive
                btnMode1.classList.remove('active-fan');
                btnMode1.classList.add('text-gray-400');
            } else {
                // Style Fan Button Active
                btnMode1.classList.add('active-fan');
                btnMode1.classList.remove('text-gray-400');
                // Style Light Button Inactive
                btnMode0.classList.remove('active-light');
                btnMode0.classList.add('text-gray-400');
            }
            
            updateUI();
            syncWithBlynk('V1', currentMode);
        }

        // Add Tailwind spin animation for the fan manually
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

        // Initialize UI on load
        updateUI();

    </script>
</body>
</html>
